name: docs

on:
  push:
    branches:
      - doctest
    tags:
      - v*
  workflow_dispatch:

jobs:
  build-and-deploy-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          filter: blob:none

      - name: Install graphviz
        run: sudo apt-get install -y graphviz

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Ford
        run: pip install ford

      - name: Ford version
        run: ford --version

      - name: Build Documentation
        run: ford Ford/docs.md

      - name: Deploy Pages
        uses: JamesIves/github-pages-deploy-action@v4
        if: github.event_name == 'push' && github.repository == 'mathomp4/ESMF' && ( startsWith( github.ref, 'refs/tags/' ) || github.ref == 'refs/heads/doctest' )
        with:
          folder: Ford/doc
          token: ${{ secrets.GITHUB_TOKEN }}

